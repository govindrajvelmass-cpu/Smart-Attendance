# ==========================================================
# SMART ATTENDANCE MANAGEMENT SYSTEM - SPRING BOOT CONFIG
# ==========================================================

# Server Configuration
server.port=${PORT:8080}

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_attendance}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DATABASE_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:govind2007}}}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Attendance Business Rules
app.attendance.late-threshold-minutes=10

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://smart-attendance-six-black.vercel.app,https://*.vercel.app,https://*.trycloudflare.com}

# Email & SMTP Configuration
spring.mail.host=${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SMTP_USER:}}
spring.mail.password=${MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000

app.mail.from=${MAIL_FROM:${SMTP_FROM:${spring.mail.username:noreply@smartattendance.local}}}
app.frontend.url=${FRONTEND_URL:https://smart-attendance-six-black.vercel.app}

